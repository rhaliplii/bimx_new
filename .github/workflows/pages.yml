# Construiește site-ul din src/ și publică dist/ pe GitHub Pages la fiecare push pe main.
# Necesită o singură dată: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # publicări programate (src/bimx-mirror/scheduled/): comunicatul din 28.09.2026 apare la 11:45 ora Moldovei (08:45 UTC);
  # GitHub poate întârzia rulările programate cu câteva minute, de aceea mai sunt două rulări de rezervă
  schedule:
    - cron: "45 8 28 9 *"
    - cron: "0 9 28 9 *"
    - cron: "30 9 28 9 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validează, construiește și verifică linkurile
        run: make check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
