<section class="bx-home-news"><div class="container">
    <div class="home_posts">
        <div class="head_section">
            <div class="left_side">
                <h2>News and announcements</h2>
                <p>The latest BIMx press releases and announcements</p>
            </div>
            <div class="right_side">
                <a href="noutati/" class="btn3">View all<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.33337 8H12.6667" stroke="#1A2266" stroke-width="1.33333" stroke-linecap="round"
                              stroke-linejoin="round"/>
                        <path d="M8 3.33325L12.6667 7.99992L8 12.6666" stroke="#1A2266" stroke-width="1.33333"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
        <div class="posts">
                        <div class="main_post">
                <div class="imag_wrap">
                                            <div class="post-thumbnail">
                            <img width="600" height="400" src="../wp-content/uploads/2026/08/article_image.png" class="attachment-large size-large wp-post-image" alt="" decoding="async" fetchpriority="high" srcset="../wp-content/uploads/2026/08/article_image.png 600w" sizes="(max-width: 600px) 100vw, 600px" style="width:100%;height:66.67%;max-width:600px;" />                        </div>
                                        <div class="data">
                        <div class="bx-post-meta"><div class="post-category cat-anunturi-bimx">{{cat}}</div><time>{{date}}</time></div>
                        <h2>{{title}}</h2>
                    </div>
                </div>
                <div class="post_content">
                    <div class="post-excerpt">
                        <p>{{excerpt}}</p>
                    </div>
                    <div class="wrap">
                        <a href="{{href}}" class="read-more">Read more<svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path d="M3.33331 8H12.6666" stroke="#1A2266" stroke-width="1.33333"
                                      stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8 3.33325L12.6667 7.99992L8 12.6666" stroke="#1A2266" stroke-width="1.33333"
                                      stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>

                        </a>
                    </div>
                </div>
            </div>
            <div class="secondary_posts_list">
                                                    {{list}}


                                                    
                                                    
                                                    
                                                    
                                                            </div>
                </div>
            </div>
</div>
</section>
